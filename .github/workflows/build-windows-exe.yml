name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build single-file EXE with PyInstaller
        run: >
          python -m PyInstaller --noconfirm --clean
          --onefile --windowed
          --name "创可贴制作-内容搜索打开工具_V1.01"
          --icon "app.ico"
          --version-file "version_info.txt"
          --collect-all rapidocr_onnxruntime
          --collect-all onnxruntime
          --collect-all pypdfium2
          --collect-all cv2
          --add-data "app.ico;."
          "main.py"

      - name: Build installer with Inno Setup (best effort)
        shell: pwsh
        continue-on-error: true
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" |
                  Sort-Object FullName -Descending | Select-Object -First 1
          if ($iscc) { & $iscc.FullName "build_installer.iss" } else { Write-Error "ISCC not found" }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: 创可贴制作-内容搜索打开工具-V1.01-exe
          path: dist/创可贴制作-内容搜索打开工具_V1.01.exe

      - name: Upload installer artifact (if built)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: 创可贴制作-内容搜索打开工具-V1.01-installer
          path: Output/创可贴制作-内容搜索打开工具_安装程序.exe
